name: Liquibase CI

on:
  push:
    branches: [ "main" ]   # Se ejecuta cuando haces push a main

jobs:
  liquibase:
    runs-on: ubuntu-latest  # Máquina donde corre el workflow

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Johan123
          POSTGRES_DB: mini_proyect
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mini_proyect"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        # Levanta PostgreSQL y espera a que esté listo

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        # Descarga tu repositorio

      - name: Ejecutar Liquibase con Docker
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/liquibase/changelog \
            -v ${{ github.workspace }}/postgresql-42.7.9.jar:/liquibase/lib/postgresql.jar \
            liquibase/liquibase:4.27.0 \
            --url=jdbc:postgresql://localhost:5432/mini_proyect \
            --username=postgres \
            --password=Johan123 \
            --driver=org.postgresql.Driver \
            --changeLogFile=changelog-master.yaml \
            update
        # Ejecuta Liquibase dentro de Docker (SIN instalarlo manualmente)
